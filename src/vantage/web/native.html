<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open a replay · Vantage</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#15191d;color:#e7e5dd}
main{max-width:680px;margin:8vh auto;padding:28px}h1{font-size:2rem}a{color:#e1be79}
label{display:block;margin:22px 0 8px}input,select,button{font:inherit;border:1px solid #53606b;border-radius:5px;padding:10px;background:#222a31;color:inherit}
input[type=text],select{width:100%;box-sizing:border-box}button{cursor:pointer;margin:18px 10px 0 0}button:disabled{opacity:.5;cursor:default}
button.primary{background:#d8b36b;color:#171c20;border-color:#d8b36b}small,.muted{color:#aab3ba}#status{line-height:1.6;margin-top:28px;white-space:pre-line}#status.error{color:#ffb1a4}
.optin{display:flex;gap:10px;align-items:start}progress{width:100%;margin-top:20px}#open,#cancel,progress{display:none}
</style>
</head>
<body><main>
<a href="/">← Recording viewer</a>
<h1>Open a replay without the game</h1>
<p>Vantage converts a replay into a recording using its matching engine. Accepted recordings can be reused.</p>
<p id="engines" class="muted">Checking imported engines…</p>
<form id="form">
<label for="replays">Replay folders</label><select id="replays"><option value="">Choose a replay, or enter its path below</option></select>
<label for="path">Replay file</label><input id="path" type="text" required placeholder="Path to a .aoe2record file" autocomplete="off">
<label class="optin"><input id="optin" type="checkbox" required><span>Use the experimental engine. Some builds and replay modes are not qualified yet.</span></label>
<button class="primary" id="convert" disabled>Convert and open</button><button type="button" id="cancel">Cancel</button>
</form>
<progress id="progress" aria-label="Replay conversion in progress"></progress>
<div id="status" role="status" aria-live="polite"></div>
<button class="primary" id="open">Open recording</button>
</main>
<script type="module">
const $=id=>document.getElementById(id);let job=null,timer=null;
async function request(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||data.message||'Request failed');return data}
function message(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function busy(value){$('convert').disabled=value;$('cancel').style.display=value?'inline-block':'none';$('progress').style.display=value?'block':'none'}
async function open(){try{await request('/api/native/open',{id:job.id});location.href='/'}catch(e){message(e.message,true)}}
async function poll(){try{job=await request('/api/native?id='+encodeURIComponent(job.id));if(job.status==='ready'){busy(false);$('open').style.display='inline-block';message((job.complete_match?'Complete recording ready.':'Preview ready: the replay file ends before the game ends.')+'\n'+job.frames.toLocaleString()+' frames');await open();return}if(['failed','cancelled'].includes(job.status)){busy(false);message(job.message||(job.status==='cancelled'?'Conversion cancelled.':'Conversion failed.'),job.status==='failed');return}message(job.phase+' · '+Math.round(job.elapsed_seconds)+' seconds');timer=setTimeout(poll,700)}catch(e){busy(false);message(e.message,true)}}
$('replays').onchange=()=>{$('path').value=$('replays').value};$('open').onclick=open;
$('form').onsubmit=async e=>{e.preventDefault();clearTimeout(timer);$('open').style.display='none';busy(true);try{job=await request('/api/native/convert',{path:$('path').value,experimental:$('optin').checked});poll()}catch(e){busy(false);message(e.message,true)}};
$('cancel').onclick=async()=>{if(job){try{await request('/api/native/cancel',{id:job.id});message('Cancelling…')}catch(e){message(e.message,true)}}};
try{const info=await request('/api/native');if(info.available){$('engines').textContent='Imported engine builds: '+info.builds.join(', ')+'. Conversion uses at most one CPU at low priority.';$('convert').disabled=false}else{$('engines').textContent='No native engine has been imported for this session.'}}
catch(e){message(e.message,true)}
try{for(const replay of await request('/api/replays')){const option=document.createElement('option');option.value=replay.dir+'/'+replay.name;option.textContent=replay.name+((replay.build)?' · build '+replay.build:'');$('replays').append(option)}}catch(e){message('Replay folders could not be read. You can still enter a file path.',true)}
</script></body></html>
