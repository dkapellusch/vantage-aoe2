<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1 2 3v5c0 3.5 2.6 6 6 7 3.4-1 6-3.5 6-7V3z' fill='%23d9b45a'/%3E%3C/svg%3E">
<!-- Critical startup paint: independent of module, skin, image and font loads. -->
<style>
html, body { margin: 0; background: #0d0f12; }
body[data-startup="loading"] > :not(#initial-load):not(script),
body[data-startup="error"] > :not(#initial-load):not(script) { visibility: hidden; }
#initial-load { position: fixed; inset: 0; z-index: 10000; display: grid; place-content: center;
  gap: 14px; text-align: center; background: #0d0f12; color: #9a958a;
  font: 14px/1.4 system-ui, sans-serif; }
#initial-load .load-mark { width: 32px; height: 32px; margin: auto;
  border: 2px solid #34312a; border-top-color: #d9b45a; border-radius: 50%;
  animation: load-turn 1.2s linear infinite; }
#initial-load p { margin: 0; }
#initial-load button { min-height: 40px; }
#initial-load [hidden] { display: none; }
body[data-startup="revealing"] > :not(#initial-load):not(script) { animation: first-frame .16s ease-out; }
body[data-startup="revealing"] #initial-load { opacity: 0; pointer-events: none; transition: opacity .16s; }
body[data-startup="ready"] #initial-load { display: none; }
html.overlay-mode #initial-load { background: transparent; }
html.overlay-mode #initial-load > * { visibility: hidden; }
@keyframes load-turn { to { transform: rotate(360deg); } }
@keyframes first-frame { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  #initial-load .load-mark, body[data-startup="revealing"] > :not(script) { animation: none; }
  body[data-startup="revealing"] #initial-load { transition: none; }
}
</style>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/hud.css">
<link rel="stylesheet" href="/static/world.css">
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/overlays.css">
<link rel="stylesheet" href="/static/team-board.css">
<link rel="stylesheet" href="/static/hud-layout.css">
<link rel="stylesheet" href="/static/player-review.css">
</head>
<body data-startup="loading">
<div id="initial-load" role="status" aria-live="polite">
  <span class="load-mark" aria-hidden="true"></span>
  <p data-i18n="Loading…">Loading…</p>
  <button id="initial-retry" type="button" hidden data-i18n="Reload">Reload</button>
  <noscript>JavaScript is needed to open this match.</noscript>
</div>
<canvas id="world"></canvas>

<div id="hud">
  <header id="scoreboard" class="panel"></header>
  <div id="leftcol">
    <section id="overview" class="panel"></section>
    <section id="techs" class="panel"></section>
    <section id="production" class="panel hidden"></section>
  </div>
  <div id="leftcol2"></div>
  <section id="events" class="panel">
    <div class="events-head">
      <span class="title" data-i18n="Events">Events</span>
      <span id="event-filters"></span>
    </div>
    <ol id="event-list"></ol>
    <div id="event-pager" class="hidden" data-i18n="New events ▾">New events ▾</div>
  </section>
  <section id="dashboard" class="panel">
    <div class="dash-head"><button id="dash-prev" class="dash-nav" title="Previous page (Alt+X)">‹</button><span id="dash-title"></span><button id="dash-next" class="dash-nav" title="Next page (Alt+C)">›</button><span class="hint">Alt+C / Alt+X</span></div>
    <div class="review-dash-body"><table id="dash-table"></table></div>
  </section>
  <section id="minimap-wrap" class="panel">
    <div id="minimap-tools">
      <button id="btn-menu" class="ico ico-menu" title="Menu (Esc)" aria-label="Menu"></button>
      <button id="btn-home" class="ico ico-home" title="Replays &amp; recordings (Ctrl+O)" aria-label="Replays &amp; recordings"></button>
      <a id="btn-native" class="ico ico-native" hidden href="/native" title="Open a replay without the game" aria-label="Open a replay without the game"></a>
      <button id="btn-stats" class="ico ico-stats" title="Statistics (Ctrl+Alt+S)" aria-label="Statistics"></button>
      <button id="btn-fog" title="Fog of war: click or right-click cycles off / spy / standard, middle-click combines team fog (Alt+F)" class="ico ico-fog" aria-label="Fog of war"></button>
      <button id="btn-mmmode" title="Minimap mode: click or right-click cycles (Alt+M)" class="ico ico-mmmode" aria-label="Minimap mode"></button>
      <button id="btn-res" class="ico ico-res" title="Resources left (Alt+R)" aria-label="Resources left"></button>
      <button id="btn-panels" title="Panels: show, hide and collapse (Alt+V)" class="ico ico-panels" aria-label="Panels"></button>
      <button id="btn-settings" class="ico ico-settings" title="Settings" aria-label="Settings"></button>
      <button id="btn-help" title="Quick reference (?)">?</button>
    </div>
    <canvas id="minimap"></canvas>
    <div id="fog-label"></div>
  </section>
  <section id="timebar" class="panel">
    <div id="time-controls">
      <button id="tc-back" title="Back 30s (-)">↺30</button>
      <button id="tc-rew" title="Rewind: play backwards; again for faster (2×, 4×, 8×)" class="ico ico-rew" aria-label="Rewind"></button>
      <button id="tc-play" class="ico ico-pause" title="Play/pause (F3)" aria-label="Play/pause"></button>
      <button id="tc-ff" title="Fast forward; again for faster (2×, 4×, 8×)" class="ico ico-ff" aria-label="Fast forward"></button>
      <button id="tc-fwd" title="Forward 30s (=)">↻30</button>
      <button id="tc-slower" title="Slower ([)">−</button>
      <span id="tc-speed">1×</span>
      <button id="tc-faster" title="Faster (])">+</button>
      <button id="tc-bookmark" title="Bookmark 30s ago (F4)">⚑</button>
      <button id="tc-live" title="Jump to live edge">LIVE</button>
      <span id="tc-clock">0:00</span>
    </div>
    <div id="time-controls2">
      <button id="tc-bm-prev" title="Previous bookmark (Shift+[)">◂⚑</button>
      <button id="tc-bm-next" title="Next bookmark (Shift+])">⚑▸</button>
      <span id="tc-real" title="Real speed: game time advanced per real second, against the target speed"></span>
      <span class="tc-live-only">
        <button id="tc-rec" title="Record this live session to a .vrec file">● <span data-i18n="REC">REC</span></button>
        <button id="tc-stop" title="Stop watching">■</button>
      </span>
    </div>
    <div id="scrub"><canvas id="scrub-canvas"></canvas><div id="scrub-skips"></div><div id="scrub-hover" class="hidden"><span></span></div></div>
  </section>
  <section id="unitpanel" class="panel hidden"></section>
  <section id="resleft" class="panel hidden"></section>
</div>

<div id="overlay-stats" class="overlay hidden"></div>
<div id="overlay-home" class="overlay hidden"></div>
<div id="overlay-settings" class="overlay hidden"></div>
<div id="overlay-help" class="overlay hidden"></div>
<div id="overlay-endgame" class="overlay hidden"></div>
<div id="overlay-docs" class="overlay hidden"></div>
<nav id="omni-menu" class="panel hidden"></nav>
<nav id="panels-menu" class="panel hidden"></nav>
<div id="launch-status" class="panel hidden"></div>
<div id="highlight-list" class="panel hidden"></div>
<div id="status-line"></div>
<div id="banners"><div id="fidelity-banner" class="hidden" role="status"></div><div id="highlight-bar" class="panel hidden"></div><div id="pause-banner" class="hidden"></div><div id="jump-banner" class="panel hidden"></div><div id="autocast-banner" class="hidden"></div><div id="toast"></div></div>
<svg width="0" height="0" style="position:absolute"><filter id="gamma"><feComponentTransfer>
  <feFuncR id="gamma-r" type="gamma" amplitude="1" exponent="1"/><feFuncG id="gamma-g" type="gamma" amplitude="1" exponent="1"/>
  <feFuncB id="gamma-b" type="gamma" amplitude="1" exponent="1"/><feFuncA id="gamma-func" type="identity" exponent="1"/>
</feComponentTransfer></filter></svg>
<div id="selbox" class="hidden"></div>
<div id="tooltip" class="hidden"></div>
<div id="techtree" class="panel hidden"></div>

<pre id="perf-view" class="hidden"></pre>
<script type="module" src="/static/app.js"></script>
</body>
</html>
