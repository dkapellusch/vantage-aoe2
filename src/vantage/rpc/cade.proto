// Messages of the game's spectator API (cade_api.rpc.CadeRemote, API v20+), as
// Vantage uses them. The package is vantage.cade so it cannot clash with another
// definition in the same process; RPCs are invoked by explicit
// "/cade_api.rpc.CadeRemote/<Method>" paths (vantage/live.py).
syntax = "proto3";
package vantage.cade;

message AccessFlagRequest {
  enum Flag {
    DISABLE_CAPTUREAGE_WARNINGS = 0;
  }
  int32 flag = 1;
  bool set = 2;
  bool value = 3;
}
message AccessFlagResponse {
  bool success = 1;
  bool value = 2;
}
message ChangeScreenRequest {
  ScreenState screen = 1;
  bool confirm = 2;
}
message ChangeScreenResponse {
  enum Code {
    OK = 0;
    FAILED_PLAYING_RANKED = 1;
    FAILED_PLAYING_MULTIPLAYER = 2;
    FAILED_PLAYING_NEED_CONFIRM = 3;
    UNSUPPORTED = 4;
  }
  int32 code = 1;
  ScreenState screen = 2;
}
message ChangeWindowStateRequest {
  enum ModeChange {
    NONE = 0;
    TO_NORMAL = 1;
    TO_MINIMIZED = 2;
    TO_MAXIMIZED = 3;
    TO_FULLSCREEN = 4;
    RESTORE_ORIGINAL = 5;
  }
  int32 modechange = 1;
  bool setforeground = 2;
  bool setfocus = 3;
  float setrenderscale = 4;
}
message ChangeWindowStateResponse {
  enum Code {
    OK = 0;
    FAILED_PLAYING = 1;
    UNSUPPORTED = 2;
    NO_WINDOW = 3;
    SET_FOCUS_FAILED = 4;
    SET_FOREGROUND_FAILED = 5;
    SET_MODE_FAILED = 6;
    ILLEGAL_RENDER_SCALE = 7;
  }
  int32 code = 1;
  WindowState windowstate = 2;
}
