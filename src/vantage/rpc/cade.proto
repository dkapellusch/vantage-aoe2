message CurrentReplay {
  string replayfile = 1;
}
message Event {
  message CombatNotificationSound {
    enum Type {
      NORMAL = 0;
      WOLF = 1;
      TOWN = 2;
    }
    int32 receiverid = 1;
    int32 type = 2;
    int32 attackedobjectid = 3;
  }
  message Damage {
    int32 entityid = 1;
    int32 attackerid = 2;
    float damage = 3;
    float hpafterdamage = 4;
    bool iskillingblow = 5;
    int32 missileid = 6;
    bool isprimarymissile = 7;
  }
  message EntityKilled {
    int32 id = 1;
    int32 killerid = 2;
  }
  message MarketTransaction {
    uint32 playerid = 1;
    uint32 attributetype = 2;
    float attributebefore = 3;
    float goldbefore = 4;
    float attributeexchanged = 5;
    float goldrate = 6;
    float goldexchanged = 7;
  }
  message MonkConversion {
    int32 monkid = 1;
    int32 monkownerid = 2;
    int32 targetid = 3;
    int32 targetownerid = 4;
  }
  message NotificationFarmOrFishTrapDied {
    int32 ownerid = 1;
    int32 objid = 2;
    bool farm = 3;
  }
  message NotificationResearchDone {
    int32 ownerid = 1;
    int32 techid = 2;
    int32 buildingid = 3;
  }
  message NotificationTrainDone {
    int32 ownerid = 1;
    int32 masterid = 2;
    int32 buildingid = 3;
    int32 objid = 4;
  }
  message NotificationWonder {
    enum Type {
      WONDER_STARTED = 0;
      WONDER_COMPLETED = 1;
      WONDER_DESTROYED = 2;
      ARTIFACTS_HELD = 3;
      ARTIFACTS_LOST = 4;
      RUINS_HELD = 5;
      RUINS_LOST = 6;
    }
    int32 ownerid = 1;
    int32 remainingtime = 2;
    int32 objid = 3;
    int32 type = 4;
  }
  message PlayerChat {
    enum Channel {
      DEFAULT = 0;
      ALLCHAT = 1;
      TEAMCHAT = 2;
      ENEMYCHAT = 3;
    }
    int32 playerid = 1;
    int32 commplayerid = 2;
    int32 channel = 3;
    string text = 4;
    int32 taunt = 5;
    uint32 destinationmap = 6;
  }
  message Tribute {
    uint32 senderid = 1;
    uint32 receiverid = 2;
    uint32 attributetype = 3;
    float sendervaluebefore = 4;
    float sendervaluechange = 5;
    float receivervaluebefore = 6;
    float receivervaluechange = 7;
  }
  oneof event {
    Event.EntityKilled entitykilled = 1;
    Event.MarketTransaction markettransaction = 2;
    Event.Tribute tribute = 3;
    Event.PlayerChat playerchat = 4;
    Event.CombatNotificationSound combatnotificationsound = 5;
    Event.Damage damage = 6;
    Event.MonkConversion monkconversion = 7;
    Event.NotificationTrainDone notificationtraindone = 8;
    Event.NotificationResearchDone notificationresearchdone = 9;
    Event.NotificationFarmOrFishTrapDied notificationfarmorfishtrapdied = 10;
    Event.NotificationWonder notificationwonder = 11;
  }
}
message Frame {
  message MetricEntry {
    enum Region {
      ALL = 0;
      ENTITIES = 1;
      SLEEPING_ENTITIES = 2;
      MAP_TILES = 3;
      UNIFIED_VISIBLE_MAP = 4;
      PARTICLES = 5;
      MASTER_ENTITIES = 6;
      RESEARCH_STATES = 7;
      VICTORY_POINTS = 8;
      APPLY_PATCH = 9;
      GAME_OPTIONS = 10;
    }
    int32 key = 1;
    uint32 timemeasured = 2;
    uint32 count = 3;
  }
  uint32 time = 1;
  bytes patch = 2;
  repeated Event event = 3;
  bytes reversepatch = 4;
  uint32 timestepsskipped = 7;
  repeated uint32 skippedtimesteps = 8;
  repeated Frame.MetricEntry metrics = 5;
  repeated Command command = 6;
}
message FrameSequence {
  repeated Frame frame = 1;
  uint32 sendingworldtime = 2;
  uint32 numberofframesqueued = 3;
}
message FramesRequest {
  message ResolutionEntry {
    enum Category {
      TIME_STEP = 0;
      LOW_PRIORITY = 1;
      SLEEPING_UNIT = 2;
      PARTICLES = 3;
      GAME_OPTIONS = 4;
      PARTICLES_SIMULATION_OUTPUT = 5;
      LOW_PRIORITY_2 = 6;
    }
    int32 key = 1;
    int32 gametimeresolution = 2;
  }
  repeated FramesRequest.ResolutionEntry desiredresolutions = 1;
  bool disablecommands = 2;
  bool disableparticles = 3;
  repeated string particledefinitionwhitelist = 4;
  bool disableparticleculling = 5;
  bool processattacknotificationsforallplayers = 6;
  bool resolvestickyunitlists = 7;
}
message InfoRequest {
}
message InfoResponse {
  uint32 gameversion = 1;
  uint32 apiversion = 2;
  string basedirectory = 3;
  repeated string enabledmoddirectories = 4;
  repeated string disabledmoddirectories = 5;
  string userdirectory = 6;
  string languagecode = 7;
  SelectedGameInfo selectedgame = 8;
}
message LoadGameRequest {
  message Cancel {
  }
  message LoadReplay {
    string filepath = 1;
    bool cloud = 2;
  }
  message RestartAsReplay {
  }
  message SpectateLobby {
    string lobbyid = 1;
  }
  oneof request {
    LoadGameRequest.SpectateLobby spectatelobby = 1;
    LoadGameRequest.LoadReplay loadreplay = 2;
    LoadGameRequest.RestartAsReplay restartasreplay = 4;
    LoadGameRequest.Cancel cancel = 5;
  }
  bool confirm = 3;
  int32 timeoutseconds = 6;
}
message LoadGameResponse {
  enum Code {
    SUCCESS = 0;
    FAILED_PLAYING_RANKED = 1;
    FAILED_PLAYING_MULTIPLAYER = 2;
    FAILED_PLAYING_NEED_CONFIRM = 3;
    FAILED_UNKNOWN_FILE_EXTENSION = 4;
    FAILED_NOT_A_RECORDED_GAME = 5;
    FAILED_TO_FETCH_FILE = 6;
