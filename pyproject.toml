[project]
name = "aoe2-vantage"
version = "0.1.0"
description = "A spectator and replay viewer for Age of Empires II: Definitive Edition, in your browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.12"
authors = [{ name = "Dan Kapellusch" }]
keywords = ["aoe2", "age-of-empires", "spectator", "replay", "esports", "casting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]
dependencies = [
    "genieutils-py==0.1.2",
    "grpcio>=1.82.1",
    "protobuf>=7.35.0",
]

[project.urls]
Homepage = "https://github.com/dkapellusch/vantage-aoe2"
Documentation = "https://github.com/dkapellusch/vantage-aoe2/tree/main/docs"
Issues = "https://github.com/dkapellusch/vantage-aoe2/issues"

[project.scripts]
vantage = "vantage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.11",
    "grpcio-tools>=1.82.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]

[tool.hatch.build.targets.sdist]
include = ["src/vantage", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "THIRD_PARTY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# protoc output is machine-generated; regenerate it rather than editing it.
extend-exclude = ["src/vantage/rpc/cade_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vantage"]
exclude = ['src/vantage/rpc/cade_pb2\.py$']

[[tool.mypy.overrides]]
# grpc, protobuf, the generated stubs and genieutils ship no type information.
module = ["grpc.*", "google.protobuf.*", "vantage.rpc.cade_pb2", "genieutils.*"]
ignore_missing_imports = true
follow_imports = "skip"
